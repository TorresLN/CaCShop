<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codo Shop</title>

    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="../assets/img/favicon-32x32.png" type="image/x-icon">
    <link rel="shortcut icon" href="../assets/img/favicon-32x32.png" type="image/x-icon">
    <!-- Libreria de iconos font-awesome -->
    <!-- <script src="https://kit.fontawesome.com/d8e1daa47e.js" crossorigin="anonymous"></script> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/carrito.css">
    <link rel="stylesheet" href="../assets/css/shop.css">
    <script src="../assets/js/productos.js"></script>
</head>


<style>
    :root {
        --colorPrimaryNormal: #00b3bb;
        --colorPrimaryHalf: #80d9dd;
        --colorPrimaryEighth: #dff5f7;
        --colorPrimaryPale: #f3f5f7;
    }

    .upload_dropZone {
        color: #0f3c4b;
        background-color: var(--colorPrimaryPale, #c8dadf);
        outline: 2px dashed var(--colorPrimaryHalf, #c1ddef);
        outline-offset: -12px;
        transition:
            outline-offset 0.2s ease-out,
            outline-color 0.3s ease-in-out,
            background-color 0.2s ease-out;
    }

    .upload_dropZone.highlight {
        outline-offset: -4px;
        outline-color: var(--colorPrimaryNormal, #0576bd);
        background-color: var(--colorPrimaryEighth, #c8dadf);
    }
</style>

</style>

<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">
                    <img class="img logo" src="../assets/img/logos/logo2 1 (Traced).png" alt="logo marca">
                </a>
                <h1 class="navbar-brand text-white">Panel de administración</h1>
            </div>
        </nav>
    </header>
    <main id="main">
        <div class="bg-light" style="margin: 1rem auto; max-width: 700px;">
            <nav class="p-2 navbar navbar-light bg-light justify-content-between">
                <h1 class="navbar-brand">Editar porducto</h1>
                <div>
                    <a href="./admin.html" class="btn btn-secondary">Volver</a>
                </div>
            </nav>
        </div>
        <div class="bg-light" style="max-width: 700px; margin: auto;">
            <form class="p-3" enctype="multipart/form-data" id="formulario">
                <div class="row">
                    <div class="col col-sm-6">
                        <div class="form-group">
                            <label for="id_titulo">Título</label>
                            <input type="text" 
                                name="titulo" id="id_titulo" 
                                class="form-control" 
                                required placeholder="Ingrese un título para el artículo"
                            >
                        </div>
                    </div>
                    <div class="col col-sm-6">
                        <div class="form-group">
                            <label for="id_precio">Precio</label>
                            <input type="text" name="precio" 
                                id="id_precio" class="form-control" 
                                required placeholder="Ingrese un precio para el artículo"
                            >
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="id_talles">Talles</label>
                            <input type="text" name="talles" 
                                id="id_talles" class="form-control" 
                                placeholder="Ingrese los Talles separados por ','" required
                            >
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="id_colores">Colores</label>
                            <input type="text" name="colores" id="id_colores" 
                                class="form-control" 
                                placeholder="Ingrese los Colores separados por ','" required
                            >
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="id_descripcion">Descripción</label>
                            <textarea  name="descripcion" id="id_descripcion" 
                                class="form-control" required></textarea>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="id_file">Imagen</label>
                            <br>
                            <label class="btn btn-secondary mb-3" for="id_file">Seleccione un archivo...</label>
                            <fieldset class="upload_dropZone text-center mb-3 p-4">
    
                                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="currentColor"
                                    class="bi bi-box-arrow-in-down" viewBox="0 0 16 16">
                                    <path fill-rule="evenodd"
                                        d="M3.5 6a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5v-8a.5.5 0 0 0-.5-.5h-2a.5.5 0 0 1 0-1h2A1.5 1.5 0 0 1 14 6.5v8a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 14.5v-8A1.5 1.5 0 0 1 3.5 5h2a.5.5 0 0 1 0 1z" />
                                    <path fill-rule="evenodd"
                                        d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z" />
                                </svg>
                                <p class="small my-2">Puede arrastrar y soltar archivos aquí para añadirlos <br><i>o</i></p>
                                <input type="file" name="imagen" class=" invisible"  id="id_file">
                                <div class="upload_gallery d-flex flex-wrap justify-content-center gap-3 mb-0"></div>
                            </fieldset>
                        </div>
                    </div>
                </div>
                <div class="container" style="text-align: right;">
                    <input type="submit" value="Enviar" class="btn btn-success">
                    <a href="./admin.html" class="btn btn-danger">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        &copy; 2024 Codo Shop. Todos los derechos reservados.
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="../assets/js/editar_producto.js"></script>
</body>
</html>
